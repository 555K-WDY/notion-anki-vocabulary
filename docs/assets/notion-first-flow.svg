<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">从 Notion 开始建立词汇库</title><desc id="desc">新增内容到词汇整理库再到 Anki 的人工确认流程。</desc>
  <style>text{font-family:Arial,'Microsoft YaHei',sans-serif;fill:#172033}.card{stroke-width:3;rx:20}.label{font-size:26px;font-weight:700}.copy{font-size:18px;fill:#506078}.arrow{stroke:#4f46e5;stroke-width:5;marker-end:url(#a)}</style>
  <defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#4f46e5"/></marker></defs>
  <rect width="1200" height="360" fill="#f8fafc"/><text x="60" y="57" class="label">路径 A：先在 Notion 收集电子词汇</text>
  <rect x="55" y="110" width="250" height="150" class="card" fill="#e0f2fe" stroke="#0284c7"/><text x="92" y="165" class="label">新增内容</text><text x="92" y="202" class="copy">阅读、课堂、日常输入</text><text x="92" y="230" class="copy">保留原句和中文理解</text>
  <line x1="325" y1="185" x2="430" y2="185" class="arrow"/>
  <rect x="450" y="110" width="300" height="150" class="card" fill="#fef3c7" stroke="#d97706"/><text x="490" y="165" class="label">词汇整理库</text><text x="490" y="202" class="copy">核对自然表达、情景、联想</text><text x="490" y="230" class="copy">每个词一张可追溯子页</text>
  <line x1="770" y1="185" x2="875" y2="185" class="arrow"/>
  <rect x="895" y="110" width="250" height="150" class="card" fill="#dcfce7" stroke="#16a34a"/><text x="948" y="165" class="label">Anki</text><text x="948" y="202" class="copy">中文情景主动回忆</text><text x="948" y="230" class="copy">专属图像 + 分离音频</text>
</svg>
