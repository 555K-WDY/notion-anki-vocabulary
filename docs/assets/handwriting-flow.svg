<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">从手写课堂笔记到个人词汇库</title><desc id="desc">照片识别先生成待确认草稿，再由学习者确认后放入 Notion 和 Anki。</desc>
  <style>text{font-family:Arial,'Microsoft YaHei',sans-serif;fill:#172033}.card{stroke-width:3;rx:20}.label{font-size:24px;font-weight:700}.copy{font-size:16px;fill:#506078}.arrow{stroke:#7c3aed;stroke-width:5;marker-end:url(#a)}</style>
  <defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#7c3aed"/></marker></defs>
  <rect width="1200" height="430" fill="#faf5ff"/><text x="55" y="55" class="label">路径 B：课堂纸质笔记照片 → 待确认草稿 → 个人词汇库</text>
  <rect x="45" y="115" width="205" height="190" class="card" fill="#fff" stroke="#a855f7"/><path d="M95 150h105v105H95z" fill="#ede9fe" stroke="#7c3aed" stroke-width="3"/><path d="M110 175h75M110 200h62M110 225h70" stroke="#7c3aed" stroke-width="4"/><text x="82" y="278" class="label">拍清晰照片</text>
  <line x1="270" y1="210" x2="375" y2="210" class="arrow"/>
  <rect x="395" y="115" width="235" height="190" class="card" fill="#f3e8ff" stroke="#9333ea"/><text x="430" y="168" class="label">视觉识别</text><text x="430" y="205" class="copy">读取英语、中文批注</text><text x="430" y="232" class="copy">输出 JSON 草稿</text><text x="430" y="259" class="copy">不会自动同步</text>
  <line x1="650" y1="210" x2="755" y2="210" class="arrow"/>
  <rect x="775" y="115" width="190" height="190" class="card" fill="#fef3c7" stroke="#d97706"/><text x="805" y="168" class="label">你来核对</text><text x="805" y="205" class="copy">字迹与拼写</text><text x="805" y="232" class="copy">含义与例句</text><text x="805" y="259" class="copy">不确定性</text>
  <line x1="985" y1="210" x2="1090" y2="210" class="arrow"/>
  <rect x="1110" y="115" width="55" height="190" class="card" fill="#dcfce7" stroke="#16a34a"/><text x="1122" y="176" class="label" transform="rotate(90 1122 176)">Notion → Anki</text>
  <text x="55" y="365" class="copy">安全规则：原照片/原记录保留在 Notion；只有确认后的内容才进入复习系统。</text>
</svg>
