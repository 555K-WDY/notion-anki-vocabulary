interface:
  display_name: "Notion → Anki Vocabulary"
  short_description: "把 Notion 或手写课堂笔记变成可核验的多模态 Anki 词汇库"
  default_prompt: "使用 $notion-anki-vocabulary 初始化或检查我的词汇系统；若我提供课堂笔记照片，先生成待人工确认草稿，再进行同步与核验。"

dependencies:
  tools:
    - type: "mcp"
      value: "notion"
      description: "Notion connector for creating, reading, and updating the vocabulary workspace"

policy:
  allow_implicit_invocation: true
